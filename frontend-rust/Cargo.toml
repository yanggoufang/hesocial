[package]
name = "hesocial-frontend"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"
publish = false

[lib]
name = "hesocial_frontend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hesocial-frontend"
path = "src/main.rs"

[dependencies]
dioxus = { version = "=0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
dioxus = { version = "=0.7.10", features = ["router", "ssr"] }
dioxus-ssr = "=0.7.10"
wasm-bindgen-test = "=0.3.77"

[features]
default = ["web"]
web = ["dioxus/web"]
split = ["dioxus/wasm-split"]
admin-bundle = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
thirtyfour = "=0.37.5"
tiny_http = "=0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.wasm-split]
inherits = "release"
opt-level = 3
debug = true
panic = "unwind"
