name = "hesocial-backend-rust"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-08-30"

# Workers Custom Domain on the account's only zone. `api.hesocial.com` from
# the roadmap was never registered as a zone here; swapping to it later is
# one more entry in this list, not a redeploy of anything else.
routes = [
  { pattern = "hesocial.ahexagram.com", custom_domain = true },
  # Kept so anything already pointed at the API-only hostname keeps working.
  { pattern = "hesocial-api.ahexagram.com", custom_domain = true },
]

[build]
command = "worker-build --release crates/worker"

# The SPA ships from the same Worker, so the frontend and the API share an
# origin: no CORS preflight, one domain, one deploy. Assets are matched first,
# except under /api/* which always reaches the Worker — otherwise the SPA
# fallback would answer unknown API paths with index.html instead of the JSON
# 404 the contract expects. Build with VITE_API_URL=/api so the bundle calls
# its own origin.
#
# The Rust SPA (frontend-rust). It builds as two bundles so a member never
# downloads the admin console, merged by `npm run build:web-rust` into
# dist-worker: the public entry at /index.html, the admin one at /admin.html,
# hashed assets side by side.
#
# THIS DIRECTORY IS GITIGNORED AND BUILT, so `npm run build:web-rust` must run
# before every `wrangler deploy` - a stale or missing tree is a broken site,
# not a build error. See docs/DEPLOYMENT_TARGETS.md.
#
# Unlike the React bundle this needs no VITE_API_URL: every path in the Rust
# SPA is a same-origin literal (`/api/auth/login`), so there is nothing to
# configure at build time.
[assets]
directory = "../frontend-rust/dist-worker"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* must reach the Worker or the SPA fallback would answer an unknown API
# path with index.html. The admin prefixes must reach it so it can hand back
# /admin.html instead of the public entry; on a miss the handler falls through
# to the fallback rather than 404ing a real route.
run_worker_first = ["/api/*", "/admin", "/admin/*", "/event-mgmt", "/event-mgmt/*"]

[vars]
# The SPA is same-origin now, so this is not what lets the site call the API.
# It still matters because the first entry is the OAuth redirect target
# (`AppState::frontend_origin`), and localhost keeps `npm run dev` working
# against the deployed Worker.
CORS_ORIGINS = "https://hesocial.ahexagram.com,http://localhost:3000"
# Gates the `Secure` flag on the visitor cookie and the environment field in
# /api/health/status.
NODE_ENV = "production"
# R2 custom domain on the account's zone, attached to the hesocial-media
# bucket. media.hesocial.com was a placeholder — that host never existed, so
# every image URL the API handed out was dead. Private documents remain R2
# keys and are never exposed by the public list route.
R2_PUBLIC_URL = "https://media.ahexagram.com"
# libSQL endpoint. TURSO_AUTH_TOKEN is a secret (wrangler secret put), and is
# omitted entirely against a local `turso dev`, which needs no authentication.
TURSO_URL = "libsql://hesocial-yanggf8.aws-ap-northeast-1.turso.io"


# Phase media: direct Workers API access; no S3 credentials are needed in the
# isolate because the binding itself grants access.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hesocial-media"

# Guards /api/auth/* only (validate is exempt, matching Express). Express used
# 20 requests / 15 minutes, but Cloudflare's binding accepts a period of just
# 10 or 60 seconds, so the window cannot be matched — 10/60s is the closest
# defensible shape: a real login is one or two requests (the Google flow is
# /google then /google/callback), while a brute-force attempt still gets
# throttled hard. The previous value of 2 was a development placeholder and
# made Google sign-in fail on its own second request.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

