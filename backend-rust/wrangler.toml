name = "hesocial-backend-rust"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-08-30"

[build]
command = "worker-build --release crates/worker"

[vars]
CORS_ORIGINS = "http://localhost:3000"
NODE_ENV = "development"
# Analytics Engine SQL API reads (Phase 2g). CLOUDFLARE_API_TOKEN stays a
# secret (wrangler secret put / .dev.vars); ANALYTICS_QUERY_STUB=true swaps
# every analytics read to a compiled-in stub for local dev / contract tests.
CLOUDFLARE_ACCOUNT_ID = "ed01ccea0b8ee7138058c4378cc83e54"
# Public custom domain (or r2.dev URL) used in image response fields. Private
# documents remain R2 keys and are never exposed by the public list route.
R2_PUBLIC_URL = "https://media.hesocial.com"
# libSQL endpoint. TURSO_AUTH_TOKEN is a secret (wrangler secret put), and is
# omitted entirely against a local `turso dev`, which needs no authentication.
TURSO_URL = "libsql://hesocial-yanggf8.aws-ap-northeast-1.turso.io"


# Phase media: direct Workers API access; no S3 credentials are needed in the
# isolate because the binding itself grants access.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hesocial-media"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

# Visitor tracking write path (Phase 2g Stage 2): one AE data point per page
# view / custom event. The dataset name matches core::analytics::DEFAULT_DATASET.
[[analytics_engine_datasets]]
binding = "TRACKING"
dataset = "hesocial_visitors"
