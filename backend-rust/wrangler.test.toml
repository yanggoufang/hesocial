name = "hesocial-backend-rust"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-08-22"

[vars]
# Dummy value for the contract harness only. Production reads the real secret
# from `wrangler secret put JWT_SECRET`.
JWT_SECRET = "contract-harness-secret-0123456789abcdef"
# Compile-in deterministic Analytics Engine rows for contract reads.
ANALYTICS_QUERY_STUB = "true"
CLOUDFLARE_ACCOUNT_ID = "contract-account"
R2_PUBLIC_URL = "https://media.hesocial.test"

[[d1_databases]]
binding = "DB"
database_name = "hesocial-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Miniflare supplies an isolated local R2 bucket to the contract harness.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hesocial-media"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Phase 2g tracking write binding. Miniflare provides the local dataset while
# Analytics reads above use ANALYTICS_QUERY_STUB and never reach the network.
[[analytics_engine_datasets]]
binding = "TRACKING"
dataset = "hesocial_visitors"
